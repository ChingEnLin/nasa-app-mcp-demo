[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-nasa-mcp"
version = "1.0.0"
description = "Simple FastAPI server with NASA data and MCP integration"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "fastapi-mcp>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/example/nasa-mcp-demo"
Documentation = "https://github.com/example/nasa-mcp-demo#readme"
Repository = "https://github.com/example/nasa-mcp-demo.git"

